name: Refresh CI Network Policy

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  refresh-policy:
    name: Update ci_open_policy with current GitHub Actions IPs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8

    steps:
      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Refresh network policy
        run: |
          python - <<'PYINLINE'
          import urllib.request, json, ipaddress, os
          import snowflake.connector

          with urllib.request.urlopen('https://api.github.com/meta') as resp:
              meta = json.loads(resp.read())

          v4 = [ip for ip in meta['actions'] if ':' not in ip]

          target_prefix = 14
          supernets = set()
          for ip in v4:
              net = ipaddress.ip_network(ip)
              if net.prefixlen < target_prefix:
                  supernets.add(net)
              else:
                  supernets.add(net.supernet(new_prefix=target_prefix))

          collapsed = sorted(ipaddress.collapse_addresses(supernets))
          ip_list = ', '.join(f"'{n}'" for n in collapsed)
          print(f"Fetched {len(v4)} IPv4 ranges, collapsed to {len(collapsed)} /{target_prefix} supernets")

          conn = snowflake.connector.connect(
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              user=os.environ['SNOWFLAKE_USER'],
              private_key_file=os.environ['SNOWFLAKE_PRIVATE_KEY_PATH'],
              private_key_file_pwd=os.environ.get('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') or None,
              role=os.environ.get('SNOWFLAKE_ROLE') or None,
          )
          cur = conn.cursor()
          cur.execute(f"ALTER NETWORK POLICY ci_open_policy SET ALLOWED_IP_LIST = ({ip_list})")
          print("ci_open_policy updated successfully")
          conn.close()
          PYINLINE
