name: dbt Production Run

on:
  push:
    branches:
      - main

jobs:
  dbt-prod:
    name: dbt run (production)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.9.4 dbt-snowflake==1.9.2

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: dbt deps
        run: dbt deps --profiles-dir ./profiles

      - name: dbt seed (prod)
        run: dbt seed --target prod --profiles-dir ./profiles

      - name: dbt run (prod)
        run: dbt run --target prod --profiles-dir ./profiles

      - name: dbt test (prod)
        run: dbt test --target prod --profiles-dir ./profiles

      - name: Upload production manifest
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-manifest
          path: target/manifest.json
          retention-days: 90
          overwrite: true
