name: dbt CI Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: dbt-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dbt-check:
    name: dbt build (slim CI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: write

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_CI_DATABASE: ${{ secrets.SNOWFLAKE_CI_DATABASE || secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DBT_LOG_PATH: logs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Download production manifest
        id: download-manifest
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: dbt-prod.yml
          name: dbt-prod-manifest
          path: ./prod-manifest
          if_no_artifact_found: warn
        continue-on-error: true

      - name: dbt deps
        run: dbt deps --profiles-dir ./profiles

      - name: dbt seed
        run: dbt seed --target check --profiles-dir ./profiles

      - name: Clone modified incremental models
        if: ${{ hashFiles('prod-manifest/manifest.json') != '' }}
        run: |
          dbt clone \
            --select "state:modified+,config.materialized:incremental" \
            --state ./prod-manifest \
            --full-refresh \
            --target check \
            --profiles-dir ./profiles

      - name: dbt build (slim CI)
        id: dbt-build
        run: |
          if [ -f ./prod-manifest/manifest.json ]; then
            echo "Production manifest found — running slim CI (state:modified+)"
            dbt build \
              --select state:modified+ \
              --defer \
              --state ./prod-manifest \
              --target check \
              --profiles-dir ./profiles
          else
            echo "No production manifest found — running full build"
            dbt build \
              --target check \
              --profiles-dir ./profiles
          fi

      - name: Render schema drift report
        id: schema-drift
        if: ${{ always() }}
        env:
          DBT_BUILD_OUTCOME: ${{ steps.dbt-build.outcome }}
        run: python .github/scripts/render_schema_drift.py

      - name: Update schema drift PR comment
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/update_schema_drift_comment.py
